args:
  - '--set-version'
  - '1.1.1'

/input/package.json: |
  {
    "name": "test",
    "version": "0.1.0",
    "scripts": {
      "version": "node version.mjs"
    }
  }
/input/version.mjs: |
  import pkg from './package.json' with { type: 'json' };

  console.log('version:', pkg.version);

/output/package.json: |
  {
    "name": "test",
    "version": "1.1.1"
  }

output: 'version: 1.1.1'
