args:
  - '--set-version'
  - '1.1.1'

/input/package.json: |
  {
    "name": "test",
    "version": "0.1.0"
  }
/input/package-lock.json: |
  {
    "name": "test",
    "version": "0.1.0",
    "lockfileVersion": 3,
    "requires": true,
    "packages": {
      "": {
        "name": "test",
        "version": "0.1.0"
      }
    }
  }

/output/package.json: |
  {
    "name": "test",
    "version": "1.1.1"
  }
/output/package-lock.json: |
  {
    "name": "test",
    "version": "1.1.1",
    "lockfileVersion": 3,
    "requires": true,
    "packages": {
      "": {
        "name": "test",
        "version": "1.1.1"
      }
    }
  }
